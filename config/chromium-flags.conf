# Read by the Arch chromium binary at startup (~/.config/chromium-flags.conf).
#
# Pin the os_crypt backend rather than letting Chromium autodetect it from
# XDG_CURRENT_DESKTOP. Autodetection is not stable across updates, and a swap
# between the gnome-libsecret (v11) and basic (v10) keys makes already-stored
# cookies and passwords undecryptable -- Chromium drops them silently and logs
# you out of everything. Pinning makes the choice deterministic.
--password-store=gnome-libsecret
